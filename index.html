  <div class="auth-tabs">
    <button class="auth-tab active" data-mode="login">Anmelden</button>
    <button class="auth-tab" data-mode="register">Registrieren</button>

  <form id="authForm" class="auth-form">
    <input type="email" id="authEmail" placeholder="E-Mail" required>

    </div>
    
    <button type="submit" class="btn btn-primary">
      <span id="authBtnText">Anmelden</span>
    </button>
    
    <button type="button" id="localOnlyBtn" class="btn btn-secondary">
      Lokal ohne Account nutzen
    </button>
  </form>
  
  <div id="authError" class="error-msg hidden"></div>
</div>

<header class="app-header">

    <div class="brand">

        <div class="brand-name">FuelBook</div>

  FIREBASE CONFIGURATION - TRAGE DEINE DATEN HIER EIN:
═══════════════════════════════════════════════════════════════

Öffne app.js und suche nach "FIREBASE CONFIG" (Zeile ~20)
Ersetze die Platzhalter mit deinen Firebase Daten:

const firebaseConfig = {
  apiKey: "DEIN_API_KEY",
  authDomain: "DEIN_PROJECT_ID.firebaseapp.com",
  projectId: "DEIN_PROJECT_ID",
  storageBucket: "DEIN_PROJECT_ID.appspot.com",
  messagingSenderId: "DEINE_SENDER_ID",
  appId: "DEINE_APP_ID"
};

So findest du deine Daten:
1. Gehe zu console.firebase.google.com
2. Wähle dein Projekt
3. Klicke auf Einstellungen (⚙️) → Projekteinstellungen
4. Scrolle zu "Deine Apps" → Web-App
5. Kopiere die Config-Werte

WICHTIG: 
- Aktiviere Authentication (Email/Password) in Firebase Console
- Aktiviere Firestore Database in Firebase Console
- Setze Firestore Rules für User-Isolation (siehe Kommentar in app.js)
